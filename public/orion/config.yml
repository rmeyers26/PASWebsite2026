backend:
  name: github
  repo: EditorPAS/PASAZ2026
  branch: main
  # Hosting is on Cloudflare Pages; login goes through a self-hosted
  # `sveltia-cms-auth` Cloudflare Worker instead of Netlify's OAuth proxy.
  # Requires a GitHub OAuth App (under the EditorPAS account) with its
  # callback URL set to https://<your-sveltia-cms-auth-worker>.workers.dev/callback
  # and Client ID/Secret entered as the Worker's secrets — see
  # workers/sveltia-cms-auth/README.md for deploy steps.
  #
  # TODO: replace with the real Worker subdomain once it's deployed.
  base_url: https://<your-sveltia-cms-auth-worker>.workers.dev
  auth_endpoint: auth

# Branding for the CMS admin UI itself (not site content) — shows on the
# login screen, the app header, and the browser tab.
app_title: "PAS Content Manager"
logo:
  src: /images/pas-logo.png
  show_in_header: true

# Direct-commit workflow, no draft/review step — see the plan's decisions
# log for why (3 named, low-technical-comfort editors, no distinct reviewer
# role identified).
publish_mode: simple

# Default location for anything uploaded through a generic "image" field
# that isn't scoped to a specific collection folder below.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: announcements
    label: "📢 Announcements"
    description: "Add or remove as needed. Shown in a banner at the top of the homepage only between the Start and End Date — hidden the rest of the time, and appears/disappears automatically on those dates without needing a new save."
    folder: "src/content/announcements"
    format: json
    create: true
    slug: "{{fields.startDate}}-announcement"
    summary: "{{fields.startDate}} → {{fields.endDate}} — {{fields.message}}"
    fields:
      - { label: "Message", name: message, widget: text, hint: "Keep it brief — about 5 lines will display on the homepage banner; anything longer is cut off." }
      - { label: "Start Date", name: startDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "The banner appears on this date." }
      - { label: "End Date", name: endDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "The banner stops appearing after this date." }

  - name: star-party-status
    label: "🚦 Star Party Status"
    description: "Turn on shortly before a star party and set the light as conditions change; turn off again afterward so visitors never see a stale status. Shown at the top of the homepage and next to the Public Star Party details on the Events page."
    files:
      - name: status
        label: "Star Party Status"
        file: "src/content/star-party-status/star-party-status.json"
        fields:
          - { label: "Show Status Light", name: enabled, widget: boolean, default: false, hint: "Off by default. Turn on to display the light; turn off when there's no star party coming up." }
          - label: "Status"
            name: status
            widget: select
            default: go
            options:
              - { label: "🟢 Go — star party is happening", value: go }
              - { label: "🟡 Standby — checking weather", value: standby }
              - { label: "🔴 Cancelled", value: cancelled }
          - { label: "Note", name: note, widget: text, required: false, hint: "Optional extra detail, e.g. \"Decision by 5pm\" or \"Clouds clearing after 9pm\" — shown next to the light. Leave blank for a generic default message." }

  - name: press-releases
    label: "🗓️ Press Releases"
    description: "Update monthly."
    folder: "src/content/press-releases"
    format: json
    create: true
    slug: "{{date}}-press-release"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}"
    fields:
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Title", name: title, widget: string, required: false, hint: "Leave blank for older releases without a known headline yet." }
      - { label: "Summary", name: summary, widget: text, required: false }
      # Leading slash on media_folder is load-bearing: without it the path is
      # resolved relative to this collection's folder, and uploads land in
      # src/content/press-releases/public/... instead of public/.
      - { label: "PDF", name: pdf, widget: file, media_folder: "/public/press-releases", public_folder: "/press-releases", hint: "Upload into the correct /YYYY subfolder to match the site's existing URL structure." }

  - name: newsletters
    label: "🗓️ Newsletters"
    description: "Update monthly."
    folder: "src/content/newsletters"
    format: json
    create: true
    slug: "{{date}}-newsletter"
    fields:
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Title", name: title, widget: string, required: false, hint: "e.g. \"August 2026 Newsletter\". Leave blank for older issues without a known title yet." }
      - { label: "Summary", name: summary, widget: text, required: false }
      # See the press-releases PDF field above for why media_folder is
      # slash-prefixed — the August 2026 issue was uploaded before this fix
      # and landed in src/content/newsletters/public/.
      - { label: "PDF", name: pdf, widget: file, media_folder: "/public/newsletters", public_folder: "/newsletters", hint: "Upload the newsletter PDF." }

  - name: lecture-videos
    label: "🗓️ Previous Lectures"
    description: "Update monthly."
    folder: "src/content/lecture-videos"
    format: json
    create: true
    slug: "{{date}}-lecture"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}"
    fields:
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Lecture Title", name: title, widget: string, hint: "e.g. \"Automating Your Telescope for Astrophotography\"" }
      - { label: "Speaker", name: speaker, widget: string }
      - { label: "Affiliation", name: affiliation, widget: string, required: false, hint: "e.g. \"PAS member\", \"Lowell Observatory\", \"ASU\"" }
      - { label: "Summary", name: summary, widget: text, required: false }
      - { label: "Video URL", name: videoUrl, widget: string, required: false, hint: "Full link to the recording (Google Drive, YouTube, etc). Leave blank until a link is available." }

  - name: gallery
    label: "🗓️ Member Gallery"
    description: "Update monthly."
    folder: "src/content/gallery"
    format: json
    create: true
    slug: "{{fields.photographer}}-{{fields.subject}}"
    fields:
      - { label: "Image", name: photo, widget: image, required: false, hint: "New uploads are not automatically resized — please keep files reasonably sized (under a few MB) before uploading. Leave blank when editing one of the site's original curated photos; only used for new uploads." }
      - { label: "Alt Text", name: alt, widget: string, hint: "Describe the image for screen readers and search engines — required." }
      - { label: "Photographer", name: photographer, widget: string }
      - { label: "Subject", name: subject, widget: string }
      - { label: "Note", name: note, widget: text }
      - { label: "Display Order", name: order, widget: number, value_type: int }
      - { label: "Category", name: category, widget: select, options: [{ label: "Astrophotography", value: astrophoto }, { label: "Club Event", value: event }], default: astrophoto }

  - name: bsig-books
    label: "🗓️ BSIG Book List"
    description: "Update monthly."
    files:
      - name: list
        label: "Book List"
        file: "src/content/bsig-books/bsig-books.json"
        fields:
          - name: books
            label: "Books"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Author", name: author, widget: string }

  - name: loaner-scopes
    label: "🔁 Telescope Loan Program"
    description: "Update quarterly."
    files:
      - name: list
        label: "Loaner Equipment"
        file: "src/content/loaner-scopes/loaner-scopes.json"
        fields:
          - name: equipment
            label: "Equipment"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string, hint: "e.g. 'Orion SkyQuest XT-10 — 10\" Dobsonian'" }
              - { label: "Photo", name: photo, widget: image, required: false, hint: "Photo of this telescope/accessory shown on the Telescope Loan Program page." }
              - { label: "Manufacturer Link", name: manufacturerUrl, widget: string, required: false, hint: "Full link to the manufacturer's product page, e.g. https://www.orionoptics.com/product/xt10 — optional." }
              - { label: "Date Added", name: dateAdded, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "When this item joined the loaner inventory — optional." }

  - name: sky-targets
    label: "🔁 Sky Targets"
    description: "Update quarterly."
    files:
      - name: list
        label: "Sky Targets List"
        file: "src/content/sky-targets/sky-targets.json"
        fields:
          - name: targets
            label: "Targets"
            widget: list
            summary: "{{fields.month}} — {{fields.name}}"
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Type", name: type, widget: string }
              - { label: "Constellation", name: constellation, widget: string }
              - { label: "Magnitude", name: magnitude, widget: string, hint: "Free text — some entries list two values, e.g. '6.9 & 8.4'." }
              - { label: "Apparent Size", name: size, widget: string }
              - { label: "Rise", name: rise, widget: string }
              - { label: "Set", name: set, widget: string }
              - label: "Month"
                name: month
                widget: select
                options: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]

  - name: officers
    label: "⭐ Officers"
    description: "Update annually."
    folder: "src/content/officers"
    format: json
    create: true
    slug: "{{fields.email}}"
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Role", name: role, widget: string }
      - { label: "Name", name: name, widget: string }
      - { label: "Email", name: email, widget: string }
      - { label: "Display Order", name: order, widget: number, value_type: int, hint: "Controls the order officer cards appear in on the About page." }
      - { label: "Photo", name: photo, widget: image, required: false }
      - { label: "Bio", name: bio, widget: text, required: false, hint: "A short biography shown on the Club Leadership page." }

  - name: timeline
    label: "⭐ Club Timeline"
    description: "Update annually."
    files:
      - name: list
        label: "Timeline"
        file: "src/content/timeline/timeline.json"
        fields:
          - name: entries
            label: "Entries"
            widget: list
            summary: "{{fields.date}} — {{fields.notes}}"
            fields:
              - { label: "Date", name: date, widget: string, hint: "A year or 'Month YYYY', e.g. '1948' or 'August 2022'." }
              - { label: "Organization", name: organization, widget: string, required: false, hint: "e.g. 'Phoenix Astronomical Society' — optional." }
              - { label: "Location", name: location, widget: string, required: false }
              - { label: "Notes", name: notes, widget: text }

  - name: past-presidents
    label: "⭐ Past Presidents"
    description: "Update annually."
    files:
      - name: list
        label: "Past Presidents List"
        file: "src/content/past-presidents/past-presidents.json"
        fields:
          - name: presidents
            label: "Presidents"
            widget: list
            summary: "{{fields.years}} — {{fields.name}}"
            fields:
              - { label: "Years", name: years, widget: string }
              - { label: "Name", name: name, widget: string }
              - { label: "Currently in Office?", name: current, widget: boolean, required: false, default: false, hint: "Should be true on exactly one entry — the sitting president." }
              - { label: "Organization", name: org, widget: select, options: ["POA", "PAS"], hint: "POA = Phoenix Observatory Association (pre-1974). PAS = Phoenix Astronomical Society (1974–present)." }

  - name: past-editors
    label: "⭐ Past Newsletter Editors"
    description: "Shown on the Newsletters page. Update annually, when the editor changes."
    files:
      - name: list
        label: "Past Editors List"
        file: "src/content/past-editors/past-editors.json"
        fields:
          - name: editors
            label: "Editors"
            widget: list
            summary: "{{fields.years}} — {{fields.name}}"
            hint: "Use 'Add' below to add a new editor, or the trash icon on an entry to remove one. When a new editor takes over, add them, check their 'Currently Editor?' box, and uncheck it on the previous entry."
            fields:
              - { label: "Years", name: years, widget: string, hint: "e.g. \"2006 – 2023\" or \"Early 1990s – 2004\"" }
              - { label: "Name", name: name, widget: string }
              - { label: "Currently Editor?", name: current, widget: boolean, required: false, default: false, hint: "Should be true on exactly one entry — the sitting editor." }
              - { label: "Role (if not Editor)", name: role, widget: string, required: false, hint: "Leave blank for the main Editor. Set only for a co-editor or assistant editor serving alongside them, e.g. \"Assistant Editor\"." }

  - name: membership
    label: "⭐ Membership Pricing"
    description: "Update annually."
    files:
      - name: pricing
        label: "Membership Pricing"
        file: "src/content/membership/membership.json"
        fields:
          - name: tiers
            label: "Membership Tiers"
            widget: list
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { label: "Name", name: name, widget: string, hint: "e.g. 'Individual Membership'" }
              - { label: "Annual Price ($)", name: price, widget: number, value_type: float, min: 0 }
              - { label: "Most Common (badge)", name: featured, widget: boolean, required: false, default: false, hint: "Highlights this tier with a 'Most Common' badge on the Join page. Should be true on at most one tier." }
          - name: addOns
            label: "Optional Add-Ons"
            widget: list
            summary: "{{fields.name}} — ${{fields.price}}"
            fields:
              - { label: "Name", name: name, widget: string, hint: "e.g. 'Name Badge'" }
              - { label: "Price ($)", name: price, widget: number, value_type: float, min: 0 }
              - { label: "Photo", name: photo, widget: image, required: false, hint: "Photo of the add-on shown on the Join page." }

  - name: scholarship-winners
    label: "⭐ Scholarship Winners"
    description: "Update annually."
    folder: "src/content/scholarship-winners"
    format: json
    create: true
    slug: "{{fields.year}}-scholarship-winners"
    fields:
      - { label: "Year", name: year, widget: string, hint: "Four-digit year, e.g. 2026" }
      - name: winners
        label: "Winners"
        widget: list
        min: 1
        max: 3
        summary: "{{fields.name}}"
        fields:
          - { label: "Student Name", name: name, widget: string }
          - { label: "School / College", name: school, widget: string }
          - { label: "Scholarship Amount", name: amount, widget: string, required: false, hint: "e.g. \"$1,000\" — optional" }
          - { label: "Description / Accomplishment", name: description, widget: text, required: false }
          - { label: "Photo", name: photo, widget: image, required: false }

  - name: newsletter-archive
    label: "⭐ Newsletter Archive"
    description: "Update annually. Historical issues before 2015."
    folder: "src/content/newsletter-archive"
    format: json
    create: true
    slug: "{{date}}-newsletter"
    fields:
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Title", name: title, widget: string, required: false, hint: "Leave blank for older issues without a known title yet." }
      - { label: "Summary", name: summary, widget: text, required: false }
      - { label: "PDF", name: pdf, widget: file, media_folder: "/public/newsletters", public_folder: "/newsletters", hint: "Upload the newsletter PDF." }

  - name: career-faqs
    label: "Career FAQs"
    files:
      - name: list
        label: "Career FAQs List"
        file: "src/content/career-faqs/career-faqs.json"
        fields:
          - name: faqs
            label: "FAQs"
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }

  - name: special-interest-groups
    label: "Special Interest Groups"
    folder: "src/content/special-interest-groups"
    format: json
    create: true
    slug: "{{fields.abbr}}"
    fields:
      - { label: "Enabled", name: enabled, widget: boolean, default: true, hint: "Turn off to hide this group from the home page and nav menu without deleting it." }
      - { label: "Title", name: title, widget: string }
      - { label: "Abbreviation", name: abbr, widget: string, hint: "e.g. ASIG" }
      - { label: "Accent Color", name: accent, widget: select, options: ["violet", "teal", "amber"] }
      - { label: "Description", name: body, widget: text }
      - { label: "Link", name: url, widget: string, hint: "Internal page (e.g. /asig) or an external URL if the group doesn't have its own page yet." }
      - { label: "Display Order", name: order, widget: number, value_type: int }

  - name: site-settings
    label: "Site Settings"
    files:
      - name: main
        label: "Site Settings"
        file: "src/content/site-settings/site-settings.json"
        fields:
          - { label: "Organization Name", name: orgName, widget: string }
          - { label: "Short Name", name: alternateName, widget: string }
          - { label: "Founding Year", name: foundingYear, widget: string }
          - { label: "Description", name: description, widget: text }
          - { label: "Logo Path", name: logo, widget: string, hint: "Path under public/, e.g. /images/pas-logo.png — not a file upload, this must match an existing file." }
          - { label: "General Email", name: email, widget: string }
          - { label: "Astronomy Questions Email", name: astronomyQuestionsEmail, widget: string }
          - { label: "Webmaster Email", name: webmasterEmail, widget: string }
          - name: socials
            label: "Social Links"
            widget: object
            fields:
              - { label: "Facebook", name: facebook, widget: string }
              - { label: "Instagram", name: instagram, widget: string }
              - { label: "Threads", name: threads, widget: string }
              - { label: "YouTube", name: youtube, widget: string }
          - { label: "Donations Enabled", name: donationsEnabled, widget: boolean, default: true, hint: "Turn off to hide the homepage Donate button and the PayPal button on the Scholarship page." }
